spring.application.name=practicaPrestamos

# Conexion a MySQL (la base de datos prestamos_db se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/prestamos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Crea y actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las consultas SQL
spring.jpa.show-sql=true
